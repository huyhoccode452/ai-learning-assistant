[pytest]
markers =
    integration: calls the real Gemini API and uses quota. Skipped by default; run with `pytest -m integration`.
    qdrant: needs a Qdrant server at QDRANT_URL (`docker compose up -d`); skipped automatically when unreachable.
# Default run = everything except integration. `-m integration` on the command line overrides this.
addopts = -m "not integration"
